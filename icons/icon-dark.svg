<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rubyDropDark" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a21"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
    <radialGradient id="darkGlow" cx="50%" cy="58%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropGlow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#f43f5e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Темная подложка иконки -->
  <rect width="512" height="512" fill="url(#darkBg)"/>
  <rect width="512" height="512" fill="url(#darkGlow)"/>
  <rect x="1" y="1" width="510" height="510" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Капля с насыщенным рубиновым градиентом и свечением -->
  <g filter="url(#dropGlow)">
    <path d="M256 64 C256 64 124 214 124 310 C124 384 183 444 256 444 C329 444 388 384 388 310 C388 214 256 64 256 64 Z" fill="url(#rubyDropDark)"/>
  </g>

  <!-- Белый медицинский крест -->
  <rect x="239" y="242" width="34" height="114" rx="10" fill="#ffffff"/>
  <rect x="199" y="282" width="114" height="34" rx="10" fill="#ffffff"/>

  <!-- Лёгкий блик на капле -->
  <path d="M168 310 C168 264 202 204 230 164" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.38"/>
</svg>
