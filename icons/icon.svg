<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rubyDrop" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#9f1239" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Прозрачный фон для идеального favicon во вкладке браузера -->
  <g filter="url(#softShadow)">
    <path d="M256 64 C256 64 124 214 124 310 C124 384 183 444 256 444 C329 444 388 384 388 310 C388 214 256 64 256 64 Z" fill="url(#rubyDrop)"/>
  </g>

  <!-- Белый медицинский крест внутри капли -->
  <rect x="239" y="242" width="34" height="114" rx="10" fill="#ffffff"/>
  <rect x="199" y="282" width="114" height="34" rx="10" fill="#ffffff"/>

  <!-- Лёгкий блик на капле -->
  <path d="M168 310 C168 264 202 204 230 164" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.32"/>
</svg>
