<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rubyDropLight" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadowLight" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9f1239" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Светлая подложка иконки -->
  <rect width="512" height="512" fill="url(#lightBg)"/>
  <rect x="1" y="1" width="510" height="510" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>

  <!-- Капля -->
  <g filter="url(#softShadowLight)">
    <path d="M256 64 C256 64 124 214 124 310 C124 384 183 444 256 444 C329 444 388 384 388 310 C388 214 256 64 256 64 Z" fill="url(#rubyDropLight)"/>
  </g>

  <!-- Белый медицинский крест -->
  <rect x="239" y="242" width="34" height="114" rx="10" fill="#ffffff"/>
  <rect x="199" y="282" width="114" height="34" rx="10" fill="#ffffff"/>

  <!-- Лёгкий блик на капле -->
  <path d="M168 310 C168 264 202 204 230 164" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.32"/>
</svg>
